<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Local Dev</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <label class="row">
    <input type="checkbox" id="enabled">
    <span>Show tape on local tabs</span>
  </label>
  <label class="row">
    <input type="checkbox" id="toolbar">
    <span>Show dev toolbar on local pages</span>
  </label>

  <label for="hosts" class="heading">Hosts</label>
  <p class="hint">One match pattern per line, for example <code>*://*.test/*</code>. Ports are ignored.</p>
  <textarea id="hosts" rows="8" spellcheck="false"></textarea>

  <label for="ports" class="heading">Ports</label>
  <p class="hint">Ports listed in the toolbar's port switcher, separated by commas.</p>
  <input id="ports" type="text" spellcheck="false">

  <div class="row">
    <button id="save">Save</button>
    <button id="reset" class="secondary">Reset to defaults</button>
    <span id="status" role="status"></span>
  </div>

  <script src="patterns.js"></script>
  <script src="options.js"></script>
</body>
</html>
